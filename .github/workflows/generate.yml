name: Generate Earthquake Visual

on:
  workflow_dispatch:
    inputs:
      quake_id:
        description: "Earthquake ID"
        required: true
        type: string
      magnitude:
        description: "Magnitude"
        required: true
        type: string
      region:
        description: "Region"
        required: true
        type: string
      country:
        description: "Country"
        required: true
        type: string
      depth:
        description: "Depth"
        required: true
        type: string
      time_str:
        description: "Time UTC"
        required: true
        type: string
      lat:
        description: "Latitude"
        required: true
        type: string
      lon:
        description: "Longitude"
        required: true
        type: string
      source:
        description: "Earthquake data source"
        required: true
        default: "EMSC"
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      QUAKE_ID: ${{ inputs.quake_id }}
      MAG: ${{ inputs.magnitude }}
      REGION: ${{ inputs.region }}
      COUNTRY: ${{ inputs.country }}
      DEPTH: ${{ inputs.depth }}
      TIME_STR: ${{ inputs.time_str }}
      LAT: ${{ inputs.lat }}
      LON: ${{ inputs.lon }}
      SOURCE: ${{ inputs.source }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check duplicate
        id: check
        run: |
          python - <<'PY'
          import json, os, sys

          quake_id = os.environ["QUAKE_ID"]

          with open("ids.json", "r") as f:
              ids = json.load(f)

          if quake_id in ids:
              print(f"Duplicate: {quake_id} — atlanıyor.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("duplicate=true\n")
          else:
              print(f"Yeni deprem: {quake_id}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("duplicate=false\n")
          PY

      - name: Stop if duplicate
        if: steps.check.outputs.duplicate == 'true'
        run: |
          echo "Duplicate deprem, işlem durduruldu."
          exit 0

      - name: Set up Python
        if: steps.check.outputs.duplicate == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.check.outputs.duplicate == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy requests pycountry

      - name: Validate inputs
        if: steps.check.outputs.duplicate == 'false'
        run: |
          python - <<'PY'
          import os
          try:
              mag = float(os.environ["MAG"])
              lat = float(os.environ["LAT"])
              lon = float(os.environ["LON"])
          except (ValueError, TypeError) as exc:
              raise SystemExit(f"Hatalı input: {exc}")
          print("Input validation successful.")
          PY

      - name: Generate earthquake image
        if: steps.check.outputs.duplicate == 'false'
        run: |
          python generate.py \
            "$MAG" \
            "$REGION" \
            "$COUNTRY" \
            "$DEPTH" \
            "$TIME_STR"
          test -s output.jpg
          echo "Image generated successfully."

      - name: Send alert to Telegram
        if: steps.check.outputs.duplicate == 'false'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests, pycountry

          token = os.environ.get("TG_TOKEN", "").strip()
          chat_id = os.environ.get("TG_CHAT_ID", "").strip()
          mapbox_token = os.environ.get("MAPBOX_TOKEN", "").strip()
          if not token or not chat_id:
              raise SystemExit("TELEGRAM_TOKEN veya TELEGRAM_CHAT_ID eksik.")

          mag = float(os.environ["MAG"])
          lat = os.environ["LAT"]
          lon = os.environ["LON"]
          region = os.environ["REGION"].upper()
          country = os.environ["COUNTRY"].upper()
          depth = os.environ["DEPTH"]
          time_str = os.environ["TIME_STR"]
          maps_url = f"https://maps.google.com/?q={lat},{lon}"
          country_tag = "#" + country.lower().replace(" ", "")

          def get_flag(country_name):
              try:
                  match = pycountry.countries.search_fuzzy(country_name)
                  if match:
                      code = match[0].alpha_2
                      return "".join(chr(127397 + ord(char)) for char in code.upper())
              except Exception:
                  pass
              return "🌍"

          flag = get_flag(os.environ["COUNTRY"])
          location = f"{region}, {country} {flag}" if region != country else f"{country} {flag}"

          message = (
              f"{location}\n"
              f"M {mag:.1f}  |  {depth}  |  {time_str}\n"
              f"{maps_url}\n\n"
              f"Stay safe. 🙏\n\n"
              f"#earthquake #seismic #earthquakereels {country_tag}"
          )

          if mapbox_token:
              map_url = (
                  f"https://api.mapbox.com/styles/v1/mapbox/outdoors-v12/static/"
                  f"pin-s+ff0000({lon},{lat})/{lon},{lat},11/1200x630"
                  f"?access_token={mapbox_token}"
              )
              map_response = requests.get(map_url, timeout=30)
              if map_response.ok:
                  response = requests.post(
                      f"https://api.telegram.org/bot{token}/sendPhoto",
                      data={"chat_id": chat_id, "caption": message},
                      files={"photo": ("map.jpg", map_response.content, "image/jpeg")},
                      timeout=30,
                  )
              else:
                  response = requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data={"chat_id": chat_id, "text": message, "disable_web_page_preview": True},
                      timeout=30,
                  )
          else:
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data={"chat_id": chat_id, "text": message, "disable_web_page_preview": True},
                  timeout=30,
              )
          print("Telegram alert sent successfully.")
          PY

      - name: Publish to Facebook
        if: steps.check.outputs.duplicate == 'false'
        env:
          FB_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          python - <<'PY'
          import os, requests, pycountry

          token = os.environ.get("FB_TOKEN", "").strip()
          page_id = os.environ.get("FB_PAGE_ID", "").strip()
          if not token or not page_id:
              raise SystemExit("FACEBOOK_PAGE_TOKEN veya FACEBOOK_PAGE_ID eksik.")

          mag = float(os.environ["MAG"])
          lat = os.environ["LAT"]
          lon = os.environ["LON"]
          region = os.environ["REGION"].upper()
          country = os.environ["COUNTRY"].upper()
          depth = os.environ["DEPTH"]
          time_str = os.environ["TIME_STR"]
          maps_url = f"https://maps.google.com/?q={lat},{lon}"
          country_tag = "#" + country.lower().replace(" ", "")

          def get_flag(country_name):
              try:
                  match = pycountry.countries.search_fuzzy(country_name)
                  if match:
                      code = match[0].alpha_2
                      return "".join(chr(127397 + ord(char)) for char in code.upper())
              except Exception:
                  pass
              return "🌍"

          flag = get_flag(os.environ["COUNTRY"])
          location = f"{region}, {country} {flag}" if region != country else f"{country} {flag}"

          message = (
              f"{location}\n"
              f"M {mag:.1f}  |  {depth}  |  {time_str}\n"
              f"{maps_url}\n\n"
              f"Stay safe. 🙏\n\n"
              f"#earthquake #seismic #earthquakereels {country_tag}"
          )

          if mag >= 6.0:
              print(f"Publishing M{mag:.1f} as Facebook photo post...")
              with open("output.jpg", "rb") as f:
                  response = requests.post(
                      f"https://graph.facebook.com/v20.0/{page_id}/photos",
                      data={"caption": message, "access_token": token},
                      files={"source": f},
                      timeout=60,
                  )
          else:
              print(f"Publishing M{mag:.1f} as Facebook text post...")
              response = requests.post(
                  f"https://graph.facebook.com/v20.0/{page_id}/feed",
                  data={"message": message, "access_token": token},
                  timeout=60,
              )

          result = response.json()
          if not response.ok or not result.get("id"):
              raise SystemExit(f"Facebook gönderisi başarısız: {result}")
          print(f"Facebook post published. ID: {result['id']}")
          PY

      - name: Save earthquake ID
        if: steps.check.outputs.duplicate == 'false'
        run: |
          python - <<'PY'
          import json, os

          quake_id = os.environ["QUAKE_ID"]

          with open("ids.json", "r") as f:
              ids = json.load(f)

          ids.append(quake_id)

          # Son 1000 ID'yi tut
          if len(ids) > 1000:
              ids = ids[-1000:]

          with open("ids.json", "w") as f:
              json.dump(ids, f)

          print(f"ID kaydedildi. Toplam: {len(ids)}")
          PY

      - name: Commit ids.json
        if: steps.check.outputs.duplicate == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ids.json
          git commit -m "Add earthquake ID: ${{ inputs.quake_id }}"
          git push

      - name: Upload earthquake image artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthquake-visual
          path: output.jpg
          if-no-files-found: warn
          retention-days: 7
