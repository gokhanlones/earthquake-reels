name: Generate Earthquake Visual

on:
  workflow_dispatch:
    inputs:
      magnitude:
        description: "Magnitude"
        required: true
        type: string

      region:
        description: "Region"
        required: true
        type: string

      country:
        description: "Country"
        required: true
        type: string

      depth:
        description: "Depth"
        required: true
        type: string

      time_str:
        description: "Time UTC"
        required: true
        type: string

      lat:
        description: "Latitude"
        required: true
        type: string

      lon:
        description: "Longitude"
        required: true
        type: string

      source:
        description: "Earthquake data source"
        required: true
        default: "EMSC"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MAG: ${{ inputs.magnitude }}
      REGION: ${{ inputs.region }}
      COUNTRY: ${{ inputs.country }}
      DEPTH: ${{ inputs.depth }}
      TIME_STR: ${{ inputs.time_str }}
      LAT: ${{ inputs.lat }}
      LON: ${{ inputs.lon }}
      SOURCE: ${{ inputs.source }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy requests

      - name: Validate inputs
        run: |
          python - <<'PY'
          import os

          try:
              mag = float(os.environ["MAG"])
              lat = float(os.environ["LAT"])
              lon = float(os.environ["LON"])
          except (ValueError, TypeError) as exc:
              raise SystemExit(
                  f"Magnitude, latitude veya longitude sayısal olmalı: {exc}"
              )

          if not 0 <= mag <= 10:
              raise SystemExit("Magnitude must be between 0 and 10.")

          if not -90 <= lat <= 90:
              raise SystemExit("Latitude must be between -90 and 90.")

          if not -180 <= lon <= 180:
              raise SystemExit("Longitude must be between -180 and 180.")

          for key in ("REGION", "COUNTRY", "DEPTH", "TIME_STR", "SOURCE"):
              if not os.environ.get(key, "").strip():
                  raise SystemExit(f"Missing input: {key}")

          print("Input validation successful.")
          PY

      - name: Generate earthquake image
        run: |
          python generate.py \
            "$MAG" \
            "$REGION" \
            "$COUNTRY" \
            "$DEPTH" \
            "$TIME_STR"

          test -s output.jpg
          echo "Earthquake image generated successfully."

      - name: Send alert to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("TG_TOKEN", "").strip()
          chat_id = os.environ.get("TG_CHAT_ID", "").strip()

          if not token or not chat_id:
              raise SystemExit(
                  "TELEGRAM_TOKEN veya TELEGRAM_CHAT_ID eksik."
              )

          mag = float(os.environ["MAG"])

          if mag < 4.0:
              dot = "🟢"
          elif mag < 5.0:
              dot = "🟡"
          elif mag < 6.0:
              dot = "🟠"
          else:
              dot = "🔴"

          lat = os.environ["LAT"]
          lon = os.environ["LON"]

          maps_url = (
              f"https://www.google.com/maps?q={lat},{lon}"
          )

          message = (
              "🌍 EARTHQUAKE ALERT\n\n"
              f"📍 {os.environ['REGION'].upper()}, "
              f"{os.environ['COUNTRY'].upper()}\n"
              f"{dot} Magnitude: {mag:.1f}\n"
              f"🔽 Depth: {os.environ['DEPTH']}\n"
              f"🕐 UTC: {os.environ['TIME_STR']}\n\n"
              f"🗺 {maps_url}\n"
              f"🔗 Source: {os.environ['SOURCE']}"
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          response = requests.post(
              url,
              data={
                  "chat_id": chat_id,
                  "text": message,
                  "disable_web_page_preview": True,
              },
              timeout=30,
          )

          try:
              result = response.json()
          except ValueError:
              raise SystemExit(
                  f"Telegram geçersiz yanıt döndürdü: HTTP {response.status_code}"
              )

          if not response.ok or not result.get("ok"):
              raise SystemExit(
                  f"Telegram gönderimi başarısız: {result}"
              )

          print("Telegram alert sent successfully.")
          PY

      - name: Publish text post to Facebook
        env:
          FB_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_API_VERSION: v26.0
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("FB_TOKEN", "").strip()
          page_id = os.environ.get("FB_PAGE_ID", "").strip()
          api_version = os.environ["FB_API_VERSION"]

          if not token or not page_id:
              raise SystemExit(
                  "FACEBOOK_PAGE_TOKEN veya FACEBOOK_PAGE_ID eksik. "
                  "GitHub Secrets ayarlarını kontrol edin."
              )

          mag = float(os.environ["MAG"])
          lat = os.environ["LAT"]
          lon = os.environ["LON"]

          if mag < 4.0:
              dot = "🟢"
          elif mag < 5.0:
              dot = "🟡"
          elif mag < 6.0:
              dot = "🟠"
          else:
              dot = "🔴"

          maps_url = (
              f"https://www.google.com/maps?q={lat},{lon}"
          )

          message = (
              "🌍 EARTHQUAKE ALERT\n\n"
              f"📍 Region: {os.environ['REGION'].upper()}, "
              f"{os.environ['COUNTRY'].upper()}\n"
              f"{dot} Magnitude: {mag:.1f}\n"
              f"🔽 Depth: {os.environ['DEPTH']}\n"
              f"🕐 Time (UTC): {os.environ['TIME_STR']}\n\n"
              f"🗺 Google Maps: {maps_url}\n"
              f"🔗 Source: {os.environ['SOURCE']}\n\n"
              "#earthquake #seismic #earthquakereels #seismicalert"
          )

          url = (
              f"https://graph.facebook.com/"
              f"{api_version}/{page_id}/feed"
          )

          print(f"Publishing M{mag:.1f} Facebook text post...")

          response = requests.post(
              url,
              data={
                  "message": message,
                  "access_token": token,
              },
              timeout=60,
          )

          try:
              result = response.json()
          except ValueError:
              raise SystemExit(
                  f"Facebook geçersiz yanıt döndürdü: HTTP {response.status_code}"
              )

          if not response.ok or not result.get("id"):
              raise SystemExit(
                  f"Facebook gönderisi başarısız: {result}"
              )

          print("Facebook text post published successfully.")
          print(f"Facebook Post ID: {result['id']}")
          PY

      - name: Upload earthquake image artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthquake-visual
          path: output.jpg
          if-no-files-found: warn
          retention-days: 7
