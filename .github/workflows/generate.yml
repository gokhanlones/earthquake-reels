name: Generate Earthquake Visual

on:
  workflow_dispatch:
    inputs:
      magnitude:
        description: 'Magnitude'
        required: true
      region:
        description: 'Region'
        required: true
      country:
        description: 'Country'
        required: true
      depth:
        description: 'Depth'
        required: true
      time_str:
        description: 'Time UTC'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install pillow numpy

      - name: Install fonts
        run: |
          sudo apt-get install -y fonts-liberation
          wget -q https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf \
            -O /usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf || true

      - name: Generate image
        run: |
          python generate.py \
            "${{ github.event.inputs.magnitude }}" \
            "${{ github.event.inputs.region }}" \
            "${{ github.event.inputs.country }}" \
            "${{ github.event.inputs.depth }}" \
            "${{ github.event.inputs.time_str }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: earthquake-visual
          path: output.jpg
