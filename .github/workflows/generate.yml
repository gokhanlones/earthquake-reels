name: Generate Earthquake Visual

on:
  workflow_dispatch:
    inputs:
      magnitude:
        description: 'Magnitude'
        required: true
      region:
        description: 'Region'
        required: true
      country:
        description: 'Country'
        required: true
      depth:
        description: 'Depth'
        required: true
      time_str:
        description: 'Time UTC'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install pillow numpy requests

      - name: Generate image
        run: |
          python generate.py \
            "${{ github.event.inputs.magnitude }}" \
            "${{ github.event.inputs.region }}" \
            "${{ github.event.inputs.country }}" \
            "${{ github.event.inputs.depth }}" \
            "${{ github.event.inputs.time_str }}"

      - name: Post to Instagram
        env:
          IG_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          IG_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python post_instagram.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: earthquake-visual
          path: output.jpg
