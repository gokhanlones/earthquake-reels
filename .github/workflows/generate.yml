name: Generate Earthquake Visual

on:
  workflow_dispatch:
    inputs:
      magnitude:
        description: 'Magnitude'
        required: true
      region:
        description: 'Region'
        required: true
      country:
        description: 'Country'
        required: true
      depth:
        description: 'Depth'
        required: true
      time_str:
        description: 'Time UTC'
        required: true
      lat:
        description: 'Latitude'
        required: true
      lon:
        description: 'Longitude'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install pillow numpy requests

      - name: Generate image
        run: |
          python generate.py \
            "${{ github.event.inputs.magnitude }}" \
            "${{ github.event.inputs.region }}" \
            "${{ github.event.inputs.country }}" \
            "${{ github.event.inputs.depth }}" \
            "${{ github.event.inputs.time_str }}"

      - name: Send to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LAT: ${{ github.event.inputs.lat }}
          LON: ${{ github.event.inputs.lon }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendPhoto" \
            -F chat_id="${TG_CHAT_ID}" \
            -F photo="@output.jpg" \
            -F caption="🌍 Earthquake Alert%0A📍 https://maps.google.com/?q=${LAT},${LON}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: earthquake-visual
          path: output.jpg
